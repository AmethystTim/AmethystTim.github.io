site_name: AMETHYST / Tim
site_url: https://amethysttim.github.io/
site_description: 在代码、论文与生活之间，记录思考留下的轨迹。
use_directory_urls: true
edit_uri: edit/main/docs/
hooks:
  - tools/hooks.py
copyright: 'Alea jacta est!'
repo_name: 'amethysttim.github.io'
repo_url: 'https://github.com/amethysttim/amethysttim.github.io'

theme:
  custom_dir: overrides
  font: false
  logo: assets/mark.svg
  favicon: assets/mark.svg
  name: material
  language: zh
  icon:
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: 切换到夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: 切换到日间模式
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.share
    - search.highlight
    - search.suggest
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/amethysttim
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/contrib/auto-render.min.js
  - javascripts/katex.js
  - javascripts/library.js
extra_css:
  - stylesheets/extra.css
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.css
markdown_extensions:
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.critic:
      mode: view
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji 
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      linenums_style: pymdownx-inline
      line_spans: __span
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - md_in_html
  - attr_list
  - toc:
      permalink: true
  - tables
plugins:
  - search:
      lang: [zh, en]
  - blog:
      blog_toc: true
      post_date_format: medium
